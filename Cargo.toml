[package]
name = "mycelium-std-fmt"
version.workspace = true
description = "std.fmt — dual human/machine formatting/display (G11)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "57ef45b453eef1f02bdfb1f0cad1034dabd32b1f" }
mycelium-std-core = { git = "https://github.com/tzervas/mycelium-std-core", rev = "276d6a1aa75b2aa15accc06bdc32886e9cf54bc4" }
# fmt.to_json/from_json delegate to std.io's one canonical JSON projection (M-514;
# ratified fmt→io delegation 2026-06-19 — spec §7-Q1 / README §5). KC-3: no new trusted code.
mycelium-std-io = { git = "https://github.com/tzervas/mycelium-std-io", rev = "f91b512d7661269f40786ad65f287e6016024042" }
serde.workspace = true
serde_json.workspace = true

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-std-fmt"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
